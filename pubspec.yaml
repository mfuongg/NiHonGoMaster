name: nihongo_master
description: Ứng dụng học tiếng Nhật toàn diện - NihonGo Master

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path: ^1.9.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  google_sign_in: ^6.3.0
  flutter_facebook_auth: ^7.1.2
  app_links: ^7.0.0
  flutter_tts: ^4.2.2
  speech_to_text: ^6.6.2
  google_mlkit_text_recognition: ^0.13.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.1
  animate_do: ^3.3.4
  fl_chart: ^0.68.0
  flip_card: ^0.7.0
  lottie: ^3.1.0
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  confetti: ^0.7.0
  audioplayers: ^6.0.0
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/data/
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
